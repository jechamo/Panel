[project]
name = "panel-backend"
version = "0.1.0"
description = "Backend for the Panel visual agent/microservice editor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
