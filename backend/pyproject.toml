[project]
name = "panel-backend"
version = "0.1.0"
description = "Backend for the Panel visual agent/microservice editor"
requires-python = ">=3.10"

# Versions are pinned with a small range so an offline `pip download` on
# a bridge machine produces a reproducible wheel set on the target.
# The lower bound is what we develop and test against; the upper bound
# is the next major to avoid surprises while still allowing patch fixes.
dependencies = [
    "fastapi>=0.115,<0.150",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=42,<50",
    "httpx>=0.27,<1.0",
    "anthropic>=0.40,<1.0",
    "openai>=1.50,<3.0",
    "google-genai>=0.3,<3.0",
    "pypdf>=4.2,<8.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
