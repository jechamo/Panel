[project]
name = "panel-backend"
version = "0.0.0"
description = "Backend scaffold for the Panel app."
requires-python = ">=3.11"
dependencies = [
	"anthropic>=0.39,<1.0",
	"fastapi>=0.115,<1.0",
	"httpx>=0.27,<1.0",
	"pydantic-settings>=2.4,<3.0",
	"uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
	"pytest>=8.3,<9.0",
	"ruff>=0.6,<1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]